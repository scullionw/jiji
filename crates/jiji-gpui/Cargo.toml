[package]
name = "jiji-gpui"
# Kept in step with the workspace's version by hand: this crate is its own
# workspace root, so it cannot inherit it.
version = "0.4.1"
edition = "2021"
license = "FSL-1.1-MIT"
publish = false
description = "Jiji: a jj-native desktop workbench, on GPUI."

[[bin]]
name = "jiji-desktop"
path = "src/main.rs"

# Its own workspace root on purpose: a separate lockfile and target dir, so
# the Tauri app's Cargo.lock, CI and release builds never see GPUI while
# both shells exist side by side.
[workspace]

[dependencies]
# gpui-pre is a weekly crates.io snapshot of Zed's main branch (the official
# `gpui` crate has not been published since 0.2.2, October 2025). The library
# names stay `gpui` and `gpui_platform`. Snapshots can break API from one to
# the next; Cargo.lock holds the one in use until `cargo update` moves it.
gpui = { package = "gpui-pre", version = "0.3.13" }
# font-kit: the macOS glyph rasterizer; without it text lays out but never
# draws. runtime_shaders: compile the Metal shaders at startup instead of at
# build time, so building needs no Xcode Metal Toolchain component.
gpui_platform = { package = "gpui-pre-platform", version = "0.3.13", features = ["font-kit", "runtime_shaders"] }
jiji-core = { path = "../jiji-core" }
jiji-forge = { path = "../jiji-forge" }
jiji-cli = { path = "../jiji-cli" }

base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
futures = "0.3"
log = "0.4"
minisign-verify = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
# getrusage, for the diff benchmark's whole-process CPU cost per frame.
libc = "0.2"
# Only to reach the NSWindow for scripted runs' `shot=` self-capture.
raw-window-handle = "0.6"

tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-css = "0.25"
tree-sitter-html = "0.23"
tree-sitter-python = "0.25"
tree-sitter-md = "0.5"
tree-sitter-yaml = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-svelte-ng = "1.0"

# Match the main workspace: optimized dependencies even in dev builds
# (jj-lib's tree diffing is ~10x slower unoptimized).
[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = "line-tables-only"
