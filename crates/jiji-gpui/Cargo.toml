[package]
name = "jiji-gpui"
version = "0.0.0"
edition = "2021"
license = "FSL-1.1-MIT"
publish = false
description = "Spike: Jiji's diff view rendered with GPUI instead of the webview."

# Its own workspace root on purpose: the spike keeps a separate lockfile and
# target dir so the shipping app's Cargo.lock, CI and release builds never
# see GPUI. Delete this directory to remove the spike entirely.
[workspace]

[dependencies]
# runtime_shaders: compile the Metal shaders at startup instead of at build
# time, so building needs no Xcode Metal Toolchain component.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
jiji-core = { path = "../jiji-core" }
# getrusage, for the benchmark's whole-process CPU cost per frame.
libc = "0.2"
# Only to reach the NSWindow for --script's `shot=` self-capture.
raw-window-handle = "0.6"

tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-css = "0.25"
tree-sitter-html = "0.23"
tree-sitter-python = "0.25"
tree-sitter-md = "0.5"
tree-sitter-yaml = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-svelte-ng = "1.0"

# Match the main workspace: optimized dependencies even in dev builds
# (jj-lib's tree diffing is ~10x slower unoptimized).
[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = "line-tables-only"
