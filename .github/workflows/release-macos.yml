name: release-macos

on:
  push:
    tags:
      - "app-v*"

jobs:
  release-macos:
    permissions:
      contents: write

    runs-on: macos-latest

    env:
      APP: target/release/bundle/Jiji.app
      DMG: dist/Jiji_darwin_universal.dmg
      ARCHIVE: dist/Jiji_darwin_universal.app.tar.gz
      NOTES: dist/notes.md

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2

      - name: check tag matches app version
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test "$VERSION" = "${GITHUB_REF_NAME#app-v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist

      - name: release notes from the changelog
        run: |
          awk -v heading="## $VERSION" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES"
          # A tag without its own changelog section is a release mistake.
          test -s "$NOTES"
          {
            echo
            echo "Download the DMG below: a universal build, signed and notarized. Existing installs update in place."
          } >> "$NOTES"

      - name: import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/certificate.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" |
            sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          test -n "$IDENTITY"
          echo "JIJI_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: build and sign Jiji.app
        run: JIJI_UNIVERSAL=1 scripts/bundle.sh

      # The system checks the bundle's floor, the loader each slice's: a
      # slice built for a newer macOS than the bundle declares would be
      # let in and fail to start.
      - name: check both slices against the bundle's macOS floor
        run: |
          FLOOR="$(plutil -extract LSMinimumSystemVersion raw "$APP/Contents/Info.plist")"
          for ARCH in arm64 x86_64; do
            MINOS="$(vtool -arch "$ARCH" -show-build "$APP/Contents/MacOS/jiji-desktop" |
              awk '$1 == "minos" { print $2 }')"
            echo "$ARCH: built for macOS $MINOS, bundle declares $FLOOR"
            test "$MINOS" = "$FLOOR"
          done

      - name: notarize the app, then the DMG that carries it
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$KEY"
          # Stapling is the check: it fails unless Apple accepted the upload.
          notarize() {
            xcrun notarytool submit "$1" --wait \
              --key "$KEY" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER"
          }

          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/Jiji.zip"
          notarize "$RUNNER_TEMP/Jiji.zip"
          xcrun stapler staple "$APP"

          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          ditto "$APP" "$STAGE/Jiji.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname Jiji -srcfolder "$STAGE" -format UDZO "$DMG"
          codesign --force --timestamp --sign "$JIJI_SIGN_IDENTITY" "$DMG"
          notarize "$DMG"
          xcrun stapler staple "$DMG"

      # What installed copies download: the stapled bundle as a tarball,
      # signed with the updater key, and the manifest that names it. The
      # key is a minisign key in the Tauri updater's wrapping (the first
      # releases shipped with that updater, and every install checks
      # against its public half), so Tauri's signer is the tool that reads
      # it. The version is exact because nothing else here locks it.
      - name: sign the updater archive and write its manifest
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          COPYFILE_DISABLE=1 tar --no-xattrs --no-mac-metadata -czf "$ARCHIVE" \
            -C "$(dirname "$APP")" Jiji.app
          npx --yes @tauri-apps/cli@2.10.1 signer sign "$ARCHIVE"
          jq -n \
            --arg version "$VERSION" \
            --rawfile notes "$NOTES" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat "$ARCHIVE.sig")" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$(basename "$ARCHIVE")" \
            '{ version: $version, notes: $notes, pub_date: $pub_date,
               platforms: { "darwin-aarch64": { signature: $signature, url: $url },
                            "darwin-x86_64":  { signature: $signature, url: $url } } }' \
            > dist/latest.json

      # A draft: installed copies and the download link keep getting the
      # previous release until someone has opened this build and published
      # it (RELEASING.md).
      - name: draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "Jiji v$VERSION" --notes-file "$NOTES" \
            "$DMG" "$ARCHIVE" "$ARCHIVE.sig" dist/latest.json
